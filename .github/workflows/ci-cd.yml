name: CI/CD Backend Node.js

on:
  push:
    branches: ["deploy"]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

      - name: Desplegar contenedor en Backend EC2 vía Bastion Host (Frontend)
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Configuración del Bastion Host (la EC2 pública del Frontend)
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.BASTION_USER }}
          proxy_key: ${{ secrets.BASTION_SSH_KEY }}

          # Configuración de la máquina objetivo (la EC2 privada del Backend)
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Descargar la última imagen desde Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest

            # 2. Detener y eliminar el contenedor anterior si existe
            docker stop backend_eval2 || true
            docker rm backend_eval2 || true

            # 3. Levantar el nuevo contenedor usando el archivo .env (que ya debe existir en la EC2 privada)
            docker run -d --name backend_eval2 -p 3000:3000 \
              --restart unless-stopped \
              --env-file .env \
              ${{ secrets.DOCKERHUB_USERNAME }}/backend-eval2:latest
